<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تأويل — Ta'weel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Lora:wght@400;600&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* Palette from the concept prototype. */
  :root{
    --bg-deep:#122B2A; --bg-page:#FBF7EE; --bg-parchment:#F5EEDA;
    --ink:#1C2B26; --ink-soft:#4A554E;
    --gold:#A9782E; --gold-deep:#8A611F;
    --teal:#2F6F63; --teal-deep:#1E4B42;
    --caution:#95583F; --line:#DED2AC; --line-soft:#E7DEC2; --white:#FFFDF7;
    --purple:#6B4E8F;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-page:#101F1E; --bg-parchment:#16২A28; --bg-parchment:#162A28;
      --ink:#EFE8D8; --ink-soft:#A9B4AC; --white:#16302C;
      --line:#2A423D; --line-soft:#223733; --gold:#D2A24F; --teal:#63AE9C;
      --caution:#C98A6E; --purple:#A98BC9;
    }
  }
  *{box-sizing:border-box}
  html[dir="ltr"] body{font-family:"Inter","Lora",system-ui,sans-serif}
  body{
    margin:0;background:var(--bg-page);color:var(--ink);
    font-family:"Tajawal","Amiri",system-ui,sans-serif;
    line-height:1.9;font-size:17px;padding:0 1rem 5rem;
  }
  .wrap{max-width:860px;margin:0 auto}

  /* --- header ------------------------------------------------------------ */
  header{background:var(--bg-deep);color:#F3EAD6;margin:0 -1rem 2rem;
    padding:2.4rem 1rem 2rem;text-align:center}
  header h1{font-family:"Amiri",serif;font-size:2.2rem;margin:0 0 .4rem;letter-spacing:1px}
  header .sub{opacity:.82;font-size:.95rem;max-width:640px;margin:0 auto}
  header .stats{opacity:.6;font-size:.8rem;margin-top:.8rem}
  .langbar{display:flex;justify-content:center;gap:.4rem;margin-bottom:1rem}
  .langbar button{background:transparent;border:1px solid rgba(255,255,255,.25);
    color:#F3EAD6;padding:.25rem .9rem;border-radius:999px;font:inherit;font-size:.82rem;cursor:pointer}
  .langbar button.on{background:var(--gold);border-color:var(--gold);color:#1C2B26;font-weight:700}

  /* --- input ------------------------------------------------------------- */
  textarea{width:100%;min-height:130px;padding:1.05rem 1.15rem;border-radius:14px;
    border:1px solid var(--line);background:var(--white);color:var(--ink);
    font:inherit;line-height:1.9;resize:vertical}
  textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
  .ctx{background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:.9rem 1.1rem;margin-top:.85rem}
  .ctx-head{color:var(--ink-soft);font-size:.84rem;margin-bottom:.65rem}
  .ctx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
  .ctx-grid label{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;color:var(--ink-soft)}
  .ctx-grid select{background:var(--bg-parchment);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:.42rem .5rem;font:inherit;font-size:.9rem}
  .row{display:flex;gap:.7rem;align-items:center;margin-top:.9rem;flex-wrap:wrap}
  button.go{background:var(--gold);color:#20180A;border:0;padding:.75rem 1.9rem;
    border-radius:11px;font:inherit;font-weight:700;cursor:pointer}
  button.go:disabled{opacity:.5;cursor:default}
  .ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);
    font:inherit;font-size:.86rem;padding:.5rem 1rem;border-radius:9px;cursor:pointer}
  .examples{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.75rem}
  .ex{background:var(--bg-parchment);border:1px solid var(--line-soft);color:var(--ink-soft);
    padding:.3rem .85rem;border-radius:999px;font-size:.84rem;cursor:pointer}
  .ex:hover{color:var(--ink);border-color:var(--gold)}

  /* --- cards ------------------------------------------------------------- */
  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;
    padding:1.2rem 1.4rem;margin-top:1.15rem}
  .card h2{font-family:"Amiri",serif;font-size:1.15rem;margin:0 0 .8rem;color:var(--gold-deep);
    display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  .badge{display:inline-block;padding:.2rem .75rem;border-radius:999px;font-size:.78rem;
    border:1px solid var(--line);background:var(--bg-parchment);color:var(--ink-soft)}
  .badge.good{color:var(--teal);border-color:var(--teal)}
  .badge.warn{color:var(--caution);border-color:var(--caution)}
  .badge.book{color:var(--gold-deep);border-color:var(--gold)}
  .badge.psych{color:var(--purple);border-color:var(--purple)}
  .why{color:var(--ink-soft);font-size:.9rem;margin-top:.4rem}

  .sym{border-top:1px solid var(--line-soft);padding:1rem 0}
  .sym:first-of-type{border-top:0;padding-top:.2rem}
  .sym h3{margin:0 0 .4rem;font-size:1.08rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .cond{background:var(--bg-parchment);border-radius:10px;padding:.55rem .9rem;margin:.45rem 0;
    font-size:.94rem;border-inline-start:3px solid var(--gold)}
  .cond b{color:var(--gold-deep)}
  .manhaj{background:var(--bg-parchment);border-radius:10px;padding:.55rem .9rem;margin-top:.5rem;
    font-size:.88rem;border-inline-start:3px solid var(--teal);color:var(--ink-soft)}
  .manhaj b{color:var(--teal)}
  .hal{background:var(--bg-parchment);border-radius:10px;padding:.55rem .9rem;margin-top:.45rem;
    font-size:.9rem;border-inline-start:3px solid var(--gold-deep)}
  .srcs{color:var(--ink-soft);font-size:.82rem;margin-top:.5rem}

  .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.9rem;margin-top:.9rem}
  .meter .lbl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-soft);margin-bottom:.28rem}
  .bar{height:8px;background:var(--bg-parchment);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px}

  .qira{border-top:1px solid var(--line-soft);padding:.85rem 0}
  .qira:first-of-type{border-top:0;padding-top:.2rem}
  .qira h4{margin:0 0 .35rem;font-size:.98rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .nasihah{background:var(--bg-parchment);border-inline-start:3px solid var(--gold);
    border-radius:12px;padding:.95rem 1.15rem;line-height:2}
  .dua{background:var(--bg-parchment);border-inline-start:3px solid var(--teal);
    border-radius:12px;padding:.9rem 1.15rem;margin-top:.6rem;font-family:"Amiri",serif;font-size:1.08rem}
  .alert{border-inline-start:3px solid var(--caution);background:var(--bg-parchment);
    border-radius:10px;padding:.85rem 1.1rem;margin-bottom:.85rem}
  .note{border-inline-start:3px solid var(--teal);background:var(--bg-parchment);
    border-radius:10px;padding:.75rem 1.1rem;font-size:.9rem;color:var(--ink-soft);margin-top:.85rem}
  .tanbih{color:var(--ink-soft);font-size:.88rem;margin-top:.9rem;
    border-top:1px dashed var(--line);padding-top:.75rem}

  details{border-top:1px solid var(--line-soft);padding:.75rem 0}
  details:first-of-type{border-top:0}
  summary{cursor:pointer;font-weight:700}
  .cite{border-inline-start:2px solid var(--line);padding-inline-start:.95rem;margin:.8rem 0 1.1rem}
  .cite .txt{white-space:pre-wrap;font-size:.95rem;font-family:"Amiri",serif}
  .cite .meta{color:var(--ink-soft);font-size:.8rem;margin-top:.4rem}
  .cite .meta a{color:var(--ink-soft)}

  .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem}
  .jrow{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start;
    border-top:1px solid var(--line-soft);padding:.7rem 0;font-size:.9rem}
  .jrow:first-child{border-top:0}
  .jmeta{color:var(--ink-soft);font-size:.78rem;white-space:nowrap}
  .jrow button{background:none;border:0;color:var(--ink-soft);cursor:pointer;padding:0 .3rem}
  .recur{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
  .recur .r{background:var(--bg-parchment);border:1px solid var(--gold);color:var(--gold-deep);
    padding:.25rem .78rem;border-radius:999px;font-size:.83rem}

  .err{color:var(--caution)}
  .foot{color:var(--ink-soft);font-size:.82rem;margin-top:2.4rem;text-align:center;line-height:1.85}
  .spin{display:inline-block;width:1em;height:1em;border:2px solid currentColor;
    border-inline-start-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media print{
    header,.ctx,.examples,.actions,textarea,.row,.langbar{display:none!important}
    body{background:#fff;color:#000;font-size:12.5px}
    .card{border:1px solid #ccc;break-inside:avoid}
  }
</style>
</head>
<body>

<header>
  <div class="langbar">
    <button id="btn-ar" class="on">العربية</button>
    <button id="btn-en">English</button>
  </div>
  <h1 id="title">تأويل</h1>
  <div class="sub" id="tagline"></div>
  <div class="stats" id="stats"></div>
</header>

<div class="wrap">
  <textarea id="dream"></textarea>

  <div class="ctx">
    <div class="ctx-head" id="ctxHead"></div>
    <div class="ctx-grid" id="ctxGrid"></div>
  </div>

  <div class="row">
    <button class="go" id="go"></button>
    <button class="ghost" id="clear"></button>
  </div>
  <div class="examples" id="examples"></div>

  <div id="out"></div>

  <div class="card" id="journalCard" style="display:none">
    <h2 id="jTitle"></h2>
    <div id="recur"></div>
    <div id="jlist"></div>
    <div class="actions"><button class="ghost" id="jclear"></button></div>
    <div class="why" id="jNote"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
// ---------------------------------------------------------------- config
// Where the API lives. In production the frontend is usually served behind the
// same host, so same-origin is the default. Three ways to override, in order:
//   1. ?api=https://api.example.com   — handy for testing against another host
//   2. window.API_BASE                — set by a build step or an inline script
//   3. localhost:3000                 — when opened from a file or a dev server,
//                                       since the API cannot be same-origin then
const API_BASE = (() => {
  const q = new URLSearchParams(location.search).get("api");
  if (q) return q.replace(/\/$/, "");
  if (window.API_BASE) return window.API_BASE.replace(/\/$/, "");
  const devPort = location.protocol === "file:" || (location.port && location.port !== "3000");
  return devPort ? "http://localhost:3000" : "";
})();
const API = API_BASE + "/api/v1";

const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------------------------------------------------------------- i18n
// The interpretation itself is always Arabic — it comes from Arabic books. This
// only translates the interface around it.
const T = {
  ar:{
    dir:"rtl", lang:"ar", title:"تأويل",
    tagline:"اكتب رؤياك، فيُبحث عن رموزها في كتب أهل التعبير، ويُعرض لك ما ورد فيها بنصّه ومصدره وصفحته.",
    placeholder:"اكتب رؤياك هنا…",
    ctxHead:"حالك (اختياري) — يُغيّر التأويل، فالكتب تفرّق بين الرجل والمرأة والمتزوج والأعزب",
    go:"فسّر الرؤيا", clear:"مسح", searching:"يُبحث في الكتب…",
    empty:"اكتب رؤياك أولاً.",
    tasnif:"تصنيف الرؤيا", basis:"أساس الجواب",
    mukhifah:"رؤيا مكروهة — هدي السنة",
    mukhifahNote:"هذه الرؤيا فيها ما يُكره، ومن هدي النبي ﷺ ألّا تُفسَّر، وأن يفعل الرائي ما يلي.",
    rumuz:"الرموز ودلالاتها", qiraat:"الرؤيا على مسالك أهل التعبير",
    khulasah:"الخلاصة", adab:"آداب الرؤيا", nasihah:"نصيحة",
    nusus:"النصوص الأصلية من الكتب", ahadith:"من أحاديث الرؤيا وآدابها",
    fromBooks:"من الكتب", fromGeneral:"من المعروف المستقر",
    classical:"من كتب التعبير", psych:"قراءة نفسية",
    manhaj:"مسلك التأويل", byState:"بحسب حالك", masadir:"المصادر",
    tafaul:"التفاؤل", raja:"الرجاء", qalaq:"القلق",
    generalNote:"لم يُعثر على رموز هذه الرؤيا في الكتب المفهرسة، فالجواب مبنيّ على ما استقرّ عند أهل التعبير لا على نصٍّ بعينه.",
    copy:"نسخ التعبير", print:"طباعة", save:"حفظ في دفتري", saved:"حُفظت ✓", copied:"نُسخ ✓",
    journal:"دفتر رؤاك", jclear:"حذف الدفتر",
    jnote:"محفوظ في متصفحك وحده، لا يُرسل إلى أي خادم.",
    recurring:"رموز تتكرر في رؤاك:",
    foot:"هذا عرضٌ لما ورد في كتب التعبير، وليس فتوى ولا حكماً شرعياً ولا علماً بالغيب.<br>التعبير ظنّي يختلف باختلاف حال الرائي، والمرجع في ذلك أهل العلم.",
    stats:(c)=>`${c.symbols.toLocaleString("ar-EG")} رمزاً · ${c.passages.toLocaleString("ar-EG")} نصاً · ${c.sources} مصادر`,
    dream:"الرؤيا", page:"ص", source:"المصدر", texts:"نص",
  },
  en:{
    dir:"ltr", lang:"en", title:"Ta'weel",
    tagline:"Describe your dream in Arabic. Its symbols are looked up in the classical books, and you are shown what they say — with the book, the author and the printed page.",
    placeholder:"Write your dream here, in Arabic…",
    ctxHead:"About you (optional) — this changes the reading; the books themselves distinguish man from woman, married from unmarried",
    go:"Interpret", clear:"Clear", searching:"Searching the books…",
    empty:"Write your dream first.",
    tasnif:"Classification", basis:"Basis of the answer",
    mukhifah:"A distressing dream — the sunna response",
    mukhifahNote:"This dream contains what is disliked. The Prophet ﷺ taught that such a dream is not interpreted; instead the dreamer does the following.",
    rumuz:"Symbols and their meanings", qiraat:"The dream across the interpretive traditions",
    khulasah:"Summary", adab:"Etiquette of dreams", nasihah:"Advice",
    nusus:"Original texts from the books", ahadith:"Hadith on dreams and their etiquette",
    fromBooks:"cited", fromGeneral:"general knowledge",
    classical:"interpretation books", psych:"psychological",
    manhaj:"Method", byState:"For your situation", masadir:"Sources",
    tafaul:"Optimism", raja:"Hope", qalaq:"Anxiety",
    generalNote:"No symbol from this dream was found in the indexed books, so the answer rests on what is settled among interpreters rather than on a specific text.",
    copy:"Copy", print:"Print", save:"Save to journal", saved:"Saved ✓", copied:"Copied ✓",
    journal:"Your dream journal", jclear:"Delete journal",
    jnote:"Stored in your browser only — never sent to any server.",
    recurring:"Symbols recurring in your dreams:",
    foot:"This presents what the classical books say. It is not a fatwa, not a ruling, and not knowledge of the unseen.<br>Interpretation is probabilistic and varies with the dreamer's situation; qualified scholars are the reference.",
    stats:(c)=>`${c.symbols.toLocaleString()} symbols · ${c.passages.toLocaleString()} passages · ${c.sources} sources`,
    dream:"Dream", page:"p.", source:"source", texts:"texts",
  }
};

let lang = localStorage.getItem("taweel_lang") || "ar";
let OPTIONS = null, STATS = null, lastResult = null;
const t = () => T[lang];

function applyLang(){
  const L = t();
  document.documentElement.lang = L.lang;
  document.documentElement.dir = L.dir;
  $("#title").textContent = L.title;
  $("#tagline").textContent = L.tagline;
  $("#dream").placeholder = L.placeholder;
  $("#ctxHead").textContent = L.ctxHead;
  $("#go").textContent = L.go;
  $("#clear").textContent = L.clear;
  $("#jTitle").textContent = L.journal;
  $("#jclear").textContent = L.jclear;
  $("#jNote").textContent = L.jnote;
  $("#foot").innerHTML = L.foot;
  $("#btn-ar").className = lang==="ar" ? "on" : "";
  $("#btn-en").className = lang==="en" ? "on" : "";
  if (STATS) $("#stats").textContent = L.stats(STATS);
  if (OPTIONS) renderContext();
  if (lastResult) render(lastResult);
  renderJournal();
}

$("#btn-ar").onclick = ()=>{ lang="ar"; localStorage.setItem("taweel_lang","ar"); applyLang(); };
$("#btn-en").onclick = ()=>{ lang="en"; localStorage.setItem("taweel_lang","en"); applyLang(); };

// ---------------------------------------------------------------- boot
async function boot(){
  try{
    const [h,o] = await Promise.all([
      fetch(API+"/health").then(r=>r.json()),
      fetch(API+"/options").then(r=>r.json()),
    ]);
    STATS = h.counts; OPTIONS = o;
    $("#examples").innerHTML = o.examples.map(e=>`<span class="ex">${esc(e)}</span>`).join("");
    document.querySelectorAll(".ex").forEach(el=>el.onclick=()=>{ $("#dream").value = el.textContent; go(); });
  }catch(e){
    $("#stats").textContent = "API unreachable — " + e.message;
  }
  applyLang();
}

function renderContext(){
  $("#ctxGrid").innerHTML = OPTIONS.fields.map(f=>`
    <label>${esc(f.label[lang])}
      <select id="f-${f.key}">
        <option value="">—</option>
        ${f.values.map(v=>`<option value="${esc(v.ar)}">${esc(v[lang])}</option>`).join("")}
      </select>
    </label>`).join("");
}

function ctxValues(){
  const o = {};
  (OPTIONS?.fields||[]).forEach(f=>{ const v = $("#f-"+f.key)?.value; if(v) o[f.key]=v; });
  return o;
}

// ---------------------------------------------------------------- request
async function go(){
  const dream = $("#dream").value.trim();
  const L = t();
  if (dream.length < 3){ $("#out").innerHTML = `<div class="card err">${L.empty}</div>`; return; }
  $("#go").disabled = true;
  $("#out").innerHTML = `<div class="card"><span class="spin"></span> ${L.searching}</div>`;
  try{
    const r = await fetch(API+"/interpret",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({dream, ...ctxValues()})
    });
    render(await r.json());
  }catch(e){
    $("#out").innerHTML = `<div class="card err">${esc(e.message)}</div>`;
  }finally{ $("#go").disabled = false; }
}

const badgeFor = naw => naw==="رؤيا صالحة" ? "good" : naw==="حلم من الشيطان" ? "warn" : "";

function render(d){
  lastResult = d;
  const L = t(), a = d.answer;
  let h = "";

  if (!a){
    h += `<div class="card err">${esc(d.meta?.error || "no answer")}</div>`;
  } else {
    h += `<div class="card"><h2>${L.tasnif}</h2>
      <span class="badge ${badgeFor(a.tasnif.naw)}">${esc(a.tasnif.naw)}</span>
      <div class="why">${esc(a.tasnif.sabab)}</div>
      <div class="srcs"><span class="badge ${a.asas_aljawab==="من الكتب المفهرسة"?"book":""}">${L.basis}: ${esc(a.asas_aljawab)}</span></div>
    </div>`;

    if (a.mukhifah){
      h += `<div class="card"><h2>${L.mukhifah}</h2>
        <div class="alert">${L.mukhifahNote}</div>
        <ul>${(a.adab||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        ${a.dua?`<div class="dua">${esc(a.dua)}</div>`:""}</div>`;
    }

    if (a.rumuz?.length){
      h += `<div class="card"><h2>${L.rumuz}</h2>` + a.rumuz.map(r=>`
        <div class="sym">
          <h3>${esc(r.ramz)} <span class="badge ${r.min_alkutub?"book":""}">${r.min_alkutub?L.fromBooks:L.fromGeneral}</span></h3>
          <div>${esc(r.khulasah)}</div>
          ${(r.tafsil||[]).map(c=>`<div class="cond"><b>${esc(c.halah)}</b> — ${esc(c.dalalah)}</div>`).join("")}
          ${r.athar_hal_alraai?`<div class="hal">${L.byState}: ${esc(r.athar_hal_alraai)}</div>`:""}
          ${r.manhaj?`<div class="manhaj"><b>${L.manhaj}:</b> ${esc(r.manhaj)}${r.bayan_almanhaj?` — ${esc(r.bayan_almanhaj)}`:""}</div>`:""}
          ${r.masadir?.length?`<div class="srcs">${L.masadir}: ${r.masadir.map(esc).join(" · ")}</div>`:""}
        </div>`).join("") + `</div>`;
    }

    if (a.qiraat?.length){
      h += `<div class="card"><h2>${L.qiraat}</h2>` + a.qiraat.map(q=>`
        <div class="qira">
          <h4>${esc(q.almanhaj)} <span class="badge ${q.min_alkutub?"book":"psych"}">${q.min_alkutub?L.fromBooks:L.fromGeneral}</span></h4>
          <div>${esc(q.nass)}</div>
        </div>`).join("") + `</div>`;
    }

    if (a.khulasah_ammah){
      h += `<div class="card"><h2>${L.khulasah}</h2><div>${esc(a.khulasah_ammah)}</div>`;
      const m = a.muashirat;
      if (m){
        const bar=(lbl,v,col)=>`<div class="meter"><div class="lbl"><span>${lbl}</span><span>${v}%</span></div>
          <div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%;background:${col}"></i></div></div>`;
        h += `<div class="meters">
          ${bar(L.tafaul,m.tafaul,"var(--teal)")}
          ${bar(L.raja,m.raja,"var(--gold)")}
          ${bar(L.qalaq,m.qalaq,"var(--caution)")}</div>`;
        if (m.bayan) h += `<div class="why">${esc(m.bayan)}</div>`;
      }
      h += `${a.tanbih?`<div class="tanbih">${esc(a.tanbih)}</div>`:""}</div>`;
    }

    if (!a.mukhifah && a.adab?.length){
      h += `<div class="card"><h2>${L.adab}</h2><ul>${a.adab.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        ${a.dua?`<div class="dua">${esc(a.dua)}</div>`:""}</div>`;
    }
    if (a.nasihah) h += `<div class="card"><h2>${L.nasihah}</h2><div class="nasihah">${esc(a.nasihah)}</div></div>`;
    if (a.asas_aljawab === "من المعرفة العامة") h += `<div class="note">${L.generalNote}</div>`;
  }

  if (d.symbols?.length){
    h += `<div class="card"><h2>${L.nusus}</h2>` + d.symbols.map(s=>`
      <details>
        <summary>${esc(s.symbol_ar)} <span class="badge">${s.citations.length} ${L.texts}</span></summary>
        ${s.citations.map(c=>`
          <div class="cite">
            <div class="txt">${esc(c.text_ar)}</div>
            <div class="meta">
              <span class="badge ${c.kind==="psychological"?"psych":"book"}">${c.kind==="psychological"?L.psych:L.classical}</span>
              ${esc(c.source_name[lang]||c.source_name.ar)}${c.printed_page?` (${L.page} ${esc(c.printed_page)})`:""}
              ${c.url?`· <a href="${esc(c.url)}" target="_blank" rel="noopener">${L.source}</a>`:""}
            </div>
          </div>`).join("")}
      </details>`).join("") + `</div>`;
  }

  if (d.adab_sources?.length){
    h += `<div class="card"><h2>${L.ahadith}</h2>` + d.adab_sources.slice(0,4).map(x=>`
      <div class="cite"><div class="txt">${esc(x.text_ar)}</div>
        <div class="meta">${esc(x.chapter_ar||"")}${x.printed_page?` (${L.page} ${esc(x.printed_page)})`:""}
          ${x.url?`· <a href="${esc(x.url)}" target="_blank" rel="noopener">${L.source}</a>`:""}</div></div>`).join("") + `</div>`;
  }

  h += `<div class="actions">
    <button class="ghost" id="copyBtn">${L.copy}</button>
    <button class="ghost" id="printBtn">${L.print}</button>
    <button class="ghost" id="saveBtn">${L.save}</button></div>`;

  $("#out").innerHTML = h;
  $("#copyBtn").onclick = copyResult;
  $("#printBtn").onclick = ()=>window.print();
  $("#saveBtn").onclick = ()=>{ saveToJournal(d); $("#saveBtn").textContent = L.saved; };
}

// ---------------------------------------------------------------- journal
// Local only. The value is not storage but seeing which symbols recur.
const JKEY = "taweel_journal_v1";
const jload = () => { try{ return JSON.parse(localStorage.getItem(JKEY)||"[]"); }catch{ return []; } };
const jsave = a => localStorage.setItem(JKEY, JSON.stringify(a.slice(0,50)));

function saveToJournal(d){
  const a = jload();
  a.unshift({t:Date.now(), dream:$("#dream").value.trim(),
             naw:d.answer?.tasnif?.naw||"", rumuz:(d.symbols||[]).map(s=>s.symbol_ar)});
  jsave(a); renderJournal();
}

function renderJournal(){
  const a = jload(), L = t();
  if (!a.length){ $("#journalCard").style.display="none"; return; }
  $("#journalCard").style.display="";
  $("#jTitle").textContent = `${L.journal} (${a.length})`;

  const counts = {};
  a.forEach(x=>(x.rumuz||[]).forEach(r=>counts[r]=(counts[r]||0)+1));
  const rec = Object.entries(counts).filter(([,n])=>n>1).sort((x,y)=>y[1]-x[1]).slice(0,10);
  $("#recur").innerHTML = rec.length
    ? `<div class="why">${L.recurring}</div><div class="recur">${rec.map(([r,n])=>`<span class="r">${esc(r)} · ${n}</span>`).join("")}</div>`
    : "";

  $("#jlist").innerHTML = a.slice(0,12).map((x,i)=>`
    <div class="jrow">
      <div>${esc(x.dream.slice(0,110))}${x.dream.length>110?"…":""}
        ${x.rumuz?.length?`<div class="why">${x.rumuz.map(esc).join(" · ")}</div>`:""}</div>
      <div class="jmeta">${new Date(x.t).toLocaleDateString(lang==="ar"?"ar-EG":"en-GB")}
        <button data-i="${i}" class="jdel">✕</button></div>
    </div>`).join("");
  document.querySelectorAll(".jdel").forEach(b=>b.onclick=()=>{
    const a2=jload(); a2.splice(+b.dataset.i,1); jsave(a2); renderJournal();
  });
}

$("#jclear").onclick = ()=>{ localStorage.removeItem(JKEY); renderJournal(); };
$("#clear").onclick = ()=>{ $("#dream").value=""; $("#out").innerHTML=""; lastResult=null; };

function copyResult(){
  const a = lastResult?.answer, L = t(); if(!a) return;
  const out = [`${L.dream}: ${$("#dream").value.trim()}`,
               `${L.tasnif}: ${a.tasnif.naw} — ${a.tasnif.sabab}`];
  (a.rumuz||[]).forEach(r=>{
    out.push(`\n• ${r.ramz} [${r.min_alkutub?L.fromBooks:L.fromGeneral}]`, `  ${r.khulasah}`);
    (r.tafsil||[]).forEach(c=>out.push(`  - ${c.halah} => ${c.dalalah}`));
    if (r.masadir?.length) out.push(`  ${L.masadir}: ${r.masadir.join(" · ")}`);
  });
  if (a.khulasah_ammah) out.push(`\n${L.khulasah}: ${a.khulasah_ammah}`);
  if (a.nasihah) out.push(`\n${L.nasihah}: ${a.nasihah}`);
  out.push(`\n${a.tanbih}`);
  navigator.clipboard.writeText(out.join("\n")).then(()=>{
    $("#copyBtn").textContent = L.copied;
    setTimeout(()=>$("#copyBtn").textContent = L.copy, 1600);
  });
}

$("#go").onclick = go;
$("#dream").addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) go(); });
boot();
</script>
